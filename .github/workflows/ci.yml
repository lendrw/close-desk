name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run Ruff check
        working-directory: backend
        run: python -m ruff check .

      - name: Run Ruff format check
        working-directory: backend
        run: python -m ruff format --check .

      - name: Run Django system check
        working-directory: backend
        run: python manage.py check --settings=config.settings_test

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run build
        working-directory: frontend
        run: npm run build

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm run test

      - name: Run format check
        working-directory: frontend
        run: npm run format:check

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: closedesk
          POSTGRES_USER: closedesk
          POSTGRES_PASSWORD: closedesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U closedesk -d closedesk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key-with-at-least-32-bytes
      DJANGO_DEBUG: 'True'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: closedesk
      POSTGRES_USER: closedesk
      POSTGRES_PASSWORD: closedesk
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      VITE_API_BASE_URL: http://127.0.0.1:8000/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate

      - name: Start backend
        working-directory: backend
        run: |
          python manage.py runserver 127.0.0.1:8000 &
          echo $! > ../backend.pid

      - name: Wait for backend
        run: |
          for attempt in {1..30}; do
            if curl --fail http://127.0.0.1:8000/api/health/; then
              exit 0
            fi

            sleep 1
          done

          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host localhost &
          echo $! > ../frontend.pid

      - name: Wait for frontend
        run: |
          for attempt in {1..30}; do
            if curl --fail http://localhost:5173/; then
              exit 0
            fi

            sleep 1
          done

          exit 1

      - name: Run E2E tests
        working-directory: frontend
        run: npm run e2e
